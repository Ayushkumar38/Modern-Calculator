<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
</head>

<body>

    <main class="app">

     <section class="calculator">

        <header class="calculator-header">
            <span>CALCULATOR</span>
            <span class="status-dot"></span>
        </header>



        <div class="display">

            <div
              class="history"
              id="history"
              ></div>

             <div 
                class="display-value"
                id="display"
                >
                 0
               </div>

        </div>

        <div class="buttons">
            <button
                class="btn special"
                data-action="clear"
                >
                 AC
                </button>

            <button
                class="btn special"
                data-action="delete"
                >
                 DEL
                </button>
               
            <button
                class="btn special"
                data-action="percent"
                >
                 %
                </button>

            <button
                class="btn operator"
                data-value="/"
                >
                 / 
                </button>

            <button
                class="btn"
                data-value="7"
                >
                 7
                </button>
              
            <button
                class="btn"
                data-value="8"
                >
                 8   
                </button>

            <button 
                class="btn"
                data-value="9"
                >
                 9
                </button>

           <button
                class="btn operator"
                data-value="*"
                >
                 *
                </button>

            <button
                class="btn"
                data-value="4"
                >
                 4
                </button>

            <button
                class="btn"
                data-value="5"
                >
                 5
                </button>

            <button
                class="btn"
                data-value="6"
                >
                 6
                </button>

            <button
                class="btn operator"
                data-value="-"
                >
                 -
                </button>

            <button
                class="btn"
                data-value="1"
                >
                 1
                </button>

            <button
                class="btn"
                data-value="2"
                >
                 2
                </button>

            <button
                class="btn"
                data-value="3"
                >
                 3
                </button>

            <button
                class="btn operator"
                data-value="+"
                >
                 +
            </button>

            <button
              class="btn zero-btn"
              data-value="0"
              >
               0
            </button>

            <button
              class="btn decimal-btn"
              data-value="."
              >
               .
            </button>

            <button
              class="btn equal-btn special"
              data-action="calculate"
              >
               =
            </button>     

        </div>

     </section>

    </main>


   

</body>
</html>
